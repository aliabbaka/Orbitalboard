name: Engine validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-oracle.txt
            backend/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r scripts/requirements-oracle.txt -r backend/requirements.txt
      - run: .venv/bin/python scripts/generate_oracle.py --check
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run validation-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-browser-evidence
          path: test-results/
          if-no-files-found: ignore
